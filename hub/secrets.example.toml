# Скопируйте в secrets.toml рядом и впишите свои значения. secrets.toml в репозиторий не попадает.

[calendar]
# Google Календарь → Настройки → выбрать календарь → «Секретный адрес в формате iCal».
# Можно несколько календарей.
ical_urls = [
    "https://calendar.google.com/calendar/ical/.../private-.../basic.ics",
]
# Ваш адрес в календаре: встречи, которые вы отклонили, не показываются. Можно оставить пустым.
my_email = ""

[weather]
# Ваши координаты для прогноза погоды (перекрывают пример из config.toml).
latitude = 55.7558
longitude = 37.6173
